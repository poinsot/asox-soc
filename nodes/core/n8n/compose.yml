# Component: n8n (owner: n8n) — SOAR, "Orchestrador"
# SQLite in the n8n data volume by default; PostgreSQL is available under the
# optional profile "pg" (switching is the n8n owner's decision, PROJECT.md 6.2).
#
# Workflows may read this container's environment ($env.WAZUH_API_URL, ...),
# so it must never contain secrets: those go in n8n credentials (created by
# scripts/bootstrap.sh) or in Compose secrets (docs/decisions.md A42).
services:
  n8n:
    image: ${N8N_IMAGE}
    restart: unless-stopped
    mem_limit: ${N8N_MEM}
    memswap_limit: ${N8N_MEM}  # no swap: an undersized limit fails visibly (D40)
    ports:
      - "${BIND_ADDR}:5678:5678"
    environment:
      N8N_PORT: "5678"
      # Explicit heap: Node's default (derived from the container limit) is
      # too small for n8n 2.x's startup (docs/decisions.md A43).
      NODE_OPTIONS: --max-old-space-size=${N8N_HEAP}
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      # Plain HTTP on the lab network (PROJECT.md 4.1): allow the login cookie.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Execution pruning: the lab agent alone forwards many level 7+ alerts (C1).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${N8N_EXECUTIONS_MAX_COUNT}
      # After a crash, only mark unfinished executions `crashed` (N8N-1.4).
      # The default ("extensive") re-amends every execution still listed in the
      # event log on EVERY start, `crashed` ones included, and calls the error
      # workflow each time: 3 parks per stale execution per restart (2.40.7).
      # Crashed alerts are requeued by the alert queue (recv-n8n-start).
      N8N_EVENTBUS_RECOVERY_MODE: simple
      # At most 10 webhook and trigger executions at once (N8N-1.8): 40 C1
      # deliveries at the same instant got n8n OOM-killed at 750m. The others
      # wait in n8n's memory and answer later. Counted (2.40.7): webhook and
      # trigger executions (the 5 s scheduler ticks included); not counted:
      # sub-workflows and error workflows. sched-alert-queue holds up to 2 for
      # up to 240 s (one per queue slot), which leaves 8 for webhooks.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "10"
      # Service URLs for workflows ($env.X); non-secret only.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WAZUH_API_URL: ${WAZUH_API_URL}
      THEHIVE_URL: ${THEHIVE_URL}
      CORTEX_URL: ${CORTEX_URL}
      # C1 threshold, also applied by recv-wazuh-alert (non-secret; lib-config
      # holds 7 only as a fallback).
      WAZUH_ALERT_MIN_LEVEL: ${WAZUH_ALERT_MIN_LEVEL:-7}
      # Is TheHive deployed for this core? false on a machine without the
      # cases node: playbooks record "skipped: TheHive not configured" instead
      # of parking every alert (non-secret; rendered by render-env.sh once the
      # integrator adds it, R-18; unset = true, the previous behaviour).
      THEHIVE_ENABLED: ${THEHIVE_ENABLED:-true}
      # Also n8n's own setting: base URL of its webhooks (what other nodes call).
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # PostgreSQL instead of SQLite (profile "pg"): uncomment together with
      # "docker compose --profile pg", then migrate workflows with n8n-export/import.
      # DB_TYPE: postgresdb
      # DB_POSTGRESDB_HOST: n8n-postgres
      # DB_POSTGRESDB_DATABASE: n8n
      # DB_POSTGRESDB_USER: n8n
      # DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_postgres_password
    secrets:
      - n8n_encryption_key
      - n8n_postgres_password
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  n8n-postgres:
    image: ${N8N_POSTGRES_IMAGE}
    profiles: [pg]
    restart: unless-stopped
    mem_limit: ${N8N_POSTGRES_MEM}
    memswap_limit: ${N8N_POSTGRES_MEM}  # no swap: an undersized limit fails visibly (D40)
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/n8n_postgres_password
    secrets:
      - n8n_postgres_password
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  n8n_encryption_key:
    environment: N8N_ENCRYPTION_KEY
  n8n_postgres_password:
    environment: N8N_POSTGRES_PASSWORD

volumes:
  n8n-data:
  n8n-postgres-data:
