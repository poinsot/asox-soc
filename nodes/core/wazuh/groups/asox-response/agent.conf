<!--
  Agent group asox-response (owner: Wazuh, C9, D44). Agents in this group may
  receive n8n's active responses (firewall-drop, through the API user
  n8n-response, whose role is limited to this group). An agent joins it as a
  second group, next to its own (linux-servers):
    /var/ossec/bin/agent_groups -a -i <agent id> -g asox-response
  Never put SOC hosts here. The agent needs iptables and active response
  enabled (the default). Nothing to push: the group exists for the role.
  Copied into /var/ossec/etc/shared/asox-response/ at every manager start, so
  the group exists on a fresh install too.
-->
