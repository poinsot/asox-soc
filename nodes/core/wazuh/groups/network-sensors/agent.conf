<!--
  Agent group network-sensors (owner: Wazuh, W5.1, D49). For a machine that
  runs Suricata (the Phase 2 sensor VM, ENROLLMENT.md "Suricata sensor VM"):
  the agent only needs to enroll in this group, and the manager tells it to
  read Suricata's alerts. Rules: built-in 86601, then rules/1010-suricata.xml.
  Suricata must write alerts to eve.json (event type alert; the other types
  are ignored by the rules but cost indexing work, so keep them off).
  Copied into /var/ossec/etc/shared/network-sensors/ at every manager start.
-->
<agent_config os="Linux">

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

</agent_config>
