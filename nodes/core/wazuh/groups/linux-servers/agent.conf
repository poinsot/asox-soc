<!--
  Agent group linux-servers (owner: Wazuh, W5.1, W5.2). Pushed by the manager
  to every agent in the group, on top of the agent's own ossec.conf.
  Copied into /var/ossec/etc/shared/linux-servers/ at every manager start.
  A source the agent's ossec.conf already reads is skipped by the agent
  (duplicated file), so this is safe on hosts whose installer added them.
-->
<agent_config os="Linux">

  <!-- File integrity: real time where an attacker persists or escalates. -->
  <syscheck>
    <directories realtime="yes" check_all="yes">/etc/passwd,/etc/shadow,/etc/group,/etc/sudoers,/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes">/etc/ssh,/root/.ssh</directories>
    <directories realtime="yes" check_all="yes">/etc/cron.d,/etc/crontab,/etc/systemd/system</directories>
    <directories realtime="yes" check_all="yes" restrict="authorized_keys$">/home</directories>
  </syscheck>

  <!-- Web servers: access logs, decoded by the built-in web-accesslog
       decoder (SQL injection 31103, 31152; X-38). A file that doesn't
       exist on a host is skipped. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>

  <!--
    Logins, sudo, users and groups (sshd, sudo, useradd, usermod) come from
    the journal. Not /var/log/auth.log as well: on a host with rsyslog every
    line is in both, and each event became two alerts (tested 2026-10-22 on
    Ubuntu 24.04: one failed SSH password, two 5760), so brute force fired at
    half the attempts. The agent's installer adds this journald source by
    itself on systemd hosts; it is repeated here for agents installed before
    systemd ran (Wazuh merges the two).
  -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

</agent_config>
