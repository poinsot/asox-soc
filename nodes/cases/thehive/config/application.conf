# TheHive 5 configuration (owner: TheHive).
# Adapted from StrangeBee's reference (StrangeBeeCorp/docker, profile "testing").
# ${VAR} values come from the container environment (nodes/cases/.env);
# never write secrets here.

play.http.secret.key = ${THEHIVE_SECRET}

# Database: Cassandra (primary) + Elasticsearch (search index, shared with
# Cortex, which uses its own indexes).
db.janusgraph {
  storage {
    backend = cql
    hostname = [${CASSANDRA_HOSTNAME}]
    cql {
      cluster-name = thp
      keyspace = thehive
    }
  }
  index.search {
    backend = elasticsearch
    hostname = [${ELASTICSEARCH_HOSTNAME}]
    index-name = thehive
    elasticsearch.http.auth {
      type = basic
      basic {
        username = elastic
        password = ${ES_PASSWORD}
      }
    }
  }
}

# Attachments, in the thehive-data volume.
storage {
  provider = localfs
  localfs.location = /data/files
}

play.http.parser.maxDiskBuffer = 1GB
play.http.parser.maxMemoryBuffer = 256kB

# Connectors. The Cortex server (C5) is configured through the API by
# scripts/bootstrap.sh, so its API key never appears in a file.
scalligraph.modules += org.thp.thehive.connector.cortex.CortexModule
scalligraph.modules += org.thp.thehive.connector.misp.MispModule
