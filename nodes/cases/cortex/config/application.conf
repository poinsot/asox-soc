# Cortex 4.1 configuration (owner: Cortex + MISP).
# Included last by the image's entrypoint, after the settings it generates
# from the environment (search.uri, job.directory, job.dockerDirectory,
# analyzer.urls, responder.urls): do NOT set those keys here, or they
# override the environment (PROJECT.md 6.5).
# ${VAR} values come from the container environment (nodes/cases/.env);
# never write secrets here.

play.http.secret.key = ${CORTEX_SECRET}

# Elasticsearch 8 (shared with TheHive; Cortex uses the "cortex" indexes).
search {
  index = cortex
  user = elastic
  password = ${ES_PASSWORD}
}

# Basic authentication for the API, used by scripts/bootstrap.sh with the
# admin login. Plain HTTP in the lab (PROJECT.md 4.1).
auth.method.basic = true

# Analyzers run as Docker containers only (the default list also tries
# kubernetes and process).
job.runners = [docker]

# Analyzer containers (docs/decisions.md A49):
# - network: soc-net in single-host mode, so they reach MISP by its alias;
#   the default bridge in distributed mode (MISP through its published port);
# - memory limit in bytes, without swap.
docker.container.networkMode = ${CORTEX_ANALYZER_NETWORK}
docker.container.memory = ${CORTEX_ANALYZER_MEM}
docker.container.memorySwap = ${CORTEX_ANALYZER_MEM}
