# Node: cases — TheHive, Cortex and their shared storage
# Integrator-owned. Each component lives in its own compose file, included
# below, so owners never edit this file (PROJECT.md section 12).
# Included files read this node's .env (rendered by scripts/render-env.sh).
name: ${SOC_INSTANCE:?missing .env, run scripts/render-env.sh}-cases

include:
  - path: storage.yml
    env_file: .env
  - path: thehive/compose.yml
    env_file: .env
  - path: cortex/compose.yml
    env_file: .env
